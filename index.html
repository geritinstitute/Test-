<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کامیونتی 🌐</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --accent: #818cf8;
  }

  body {
    font-family: Tahoma, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    line-height: 1.6;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
    padding: 20px;
  }

  header h1 {
    font-size: 2.2rem;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p { color: var(--muted); font-size: 15px; }

  main { max-width: 620px; margin: 0 auto; }

  .new-post {
    background: var(--card);
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .new-post input,
  .new-post textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }

  .new-post input:focus,
  .new-post textarea:focus { border-color: var(--primary); }

  .new-post textarea { min-height: 90px; resize: vertical; }

  .new-post button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    font-family: inherit;
    transition: background 0.2s, transform 0.1s;
  }

  .new-post button:hover:not(:disabled) { background: var(--primary-hover); }
  .new-post button:active:not(:disabled) { transform: scale(0.98); }
  .new-post button:disabled { opacity: 0.5; cursor: wait; }

  .post {
    background: var(--card);
    padding: 16px 18px;
    border-radius: 12px;
    margin-bottom: 12px;
    border-right: 4px solid var(--primary);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    border-left: 1px solid var(--border);
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .post .author {
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 8px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .post .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: white;
    font-weight: bold;
  }

  .post .text {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
  }

  .post .time {
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 50px 20px;
    background: var(--card);
    border-radius: 12px;
    border: 1px dashed var(--border);
  }

  .loading {
    text-align: center;
    color: var(--muted);
    padding: 30px;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--card);
    color: var(--text);
    padding: 12px 24px;
    border-radius: 10px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: transform 0.3s ease;
    z-index: 1000;
    font-size: 14px;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: #ef4444; }
  .toast.success { border-color: #22c55e; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 40px;
    padding: 20px;
  }

  @media (max-width: 500px) {
    header h1 { font-size: 1.7rem; }
    body { padding: 12px; }
  }
</style>
</head>
<body>

<header>
  <h1>🌐 کامیونتی</h1>
  <p>یه جای ساده برای گفتگو</p>
</header>

<main>
  <section class="new-post">
    <input id="author" type="text" placeholder="اسمت چیه؟" maxlength="30" autocomplete="off">
    <textarea id="text" placeholder="چی توی ذهنته؟" maxlength="500"></textarea>
    <button id="submit">ارسال ✉️</button>
  </section>

  <section id="posts">
    <div class="loading">
      <div class="spinner"></div>
      در حال بارگذاری...
    </div>
  </section>
</main>

<footer>
  ساخته شده با ❤️ برای کامیونتی
</footer>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   ✅ URL بینت اینجاست — دیگه لازم نیست عوض کنی
   ============================================================ */
const NPOINT_URL = "https://api.npoint.io/2372e8157736f4ccfbd4";
/* ============================================================ */

const $author = document.getElementById("author");
const $text   = document.getElementById("text");
const $submit = document.getElementById("submit");
const $posts  = document.getElementById("posts");
const $toast  = document.getElementById("toast");

const savedName = localStorage.getItem("community_name");
if (savedName) $author.value = savedName;

let toastTimer;
function showToast(msg, type = "") {
  $toast.textContent = msg;
  $toast.className = "toast show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    $toast.className = "toast " + type;
  }, 2500);
}

function escape(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function initial(name) {
  return escape(name.trim().charAt(0).toUpperCase() || "?");
}

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "همین الان";
  if (diff < 3600) return Math.floor(diff / 60) + " دقیقه پیش";
  if (diff < 86400) return Math.floor(diff / 3600) + " ساعت پیش";
  if (diff < 604800) return Math.floor(diff / 86400) + " روز پیش";
  return new Date(iso).toLocaleDateString("fa-IR");
}

async function loadPosts() {
  try {
    const res  = await fetch(NPOINT_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error("خطای شبکه");
    const data = await res.json();
    render(data.posts || []);
  } catch (err) {
    $posts.innerHTML = '<div class="empty">خطا در بارگذاری 😢<br><small>' + escape(err.message) + '</small></div>';
    console.error(err);
  }
}

function render(posts) {
  if (!posts.length) {
    $posts.innerHTML = '<div class="empty">هنوز پستی نیست.<br>اولین نفر باش! ✨</div>';
    return;
  }

  const sorted = [...posts].reverse();

  $posts.innerHTML = sorted.map(p => `
    <div class="post">
      <div class="author">
        <span class="avatar">${initial(p.author)}</span>
        ${escape(p.author)}
      </div>
      <div class="text">${escape(p.text)}</div>
      <div class="time">${timeAgo(p.time)}</div>
    </div>
  `).join("");
}

async function submitPost() {
  const author = $author.value.trim();
  const text   = $text.value.trim();

  if (!author) { showToast("اسمت رو بنویس!", "error"); $author.focus(); return; }
  if (!text)   { showToast("متن پست خالیه!", "error"); $text.focus(); return; }

  $submit.disabled = true;
  $submit.textContent = "در حال ارسال...";

  try {
    const cur   = await (await fetch(NPOINT_URL + "?t=" + Date.now())).json();
    const posts = cur.posts || [];

    posts.push({
      id: Date.now(),
      author,
      text,
      time: new Date().toISOString()
    });

    const res = await fetch(NPOINT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ posts })
    });

    if (!res.ok) throw new Error("ذخیره نشد");

    localStorage.setItem("community_name", author);

    $text.value = "";
    showToast("پست ارسال شد! ✅", "success");
    await loadPosts();
  } catch (err) {
    showToast("خطا: " + err.message, "error");
    console.error(err);
  } finally {
    $submit.disabled = false;
    $submit.textContent = "ارسال ✉️";
  }
}

$submit.addEventListener("click", submitPost);

$text.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.key === "Enter") submitPost();
});

loadPosts();
</script>

</body>
</html>
